<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>列表页</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!--导航 使用公共部分进行替换-->
<div th:replace="~{common :: myheader}"></div>
<div class="container">
    <table class="table">
        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">名字</th>
            <th scope="col">邮箱</th>
            <th scope="col">年龄</th>
            <th scope="col">是否成年人</th>
            <th scope="col">角色</th>
            <th scope="col">状态</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="person, stats : ${persons}" th:if="${person.age > 10}" th:object="${person}">
            <th scope="row" th:text="${person.id}"></th>
            <!--<td th:text="${person.userName}"></td>-->
            <td th:text="*{userName}"></td>
            <td th:if="${#strings.isEmpty(person.email)}" th:text="'无法联系！'"></td>
            <td th:if="${not #strings.isEmpty(person.email)}">[(${person.email})]</td>
            <td>[[${person.age}]]</td>
            <td th:text="|${person.age}/${person.age>=18?'成年人':'未成年'}|"></td>
            <td th:switch="${person.role}">
                <button th:case="'admin'" type="button" class="btn btn-danger"
                        th:text="|${person.role}/管理员|"></button>
                <button th:case="'pm'" type="button" class="btn btn-primary"
                        th:text="|${person.role}/项目经理|"></button>
                <button th:case="'hr'" type="button" class="btn btn-info" th:text="|${person.role}/人事|"></button>
                <!--默认选项-->
                <button th:case="*" type="button" class="btn btn-dark" th:text="|${person.role}/未知岗位|"></button>
            </td>
            <td>
                index: [[${stats.index}]] <br>
                count: [[${stats.count}]] <br>
                size: [[${stats.size}]] <br>
                current: [[${stats.current}]] <br>
                even(true)/odd(false): 是偶数吗？[[${stats.even}]] <br>
                first: [[${stats.first}]] <br>
                last: [[${stats.last}]] <br>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
